name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * *"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: npx supabase start
      - name: Export Supabase env
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "ENABLE_TEST_AUTH=true"
          } >> "$GITHUB_ENV"
      - name: Reset local database
        run: |
          # Wait for Supabase to be ready
          for i in {1..30}; do
            if npx supabase status > /dev/null 2>&1; then
              echo "Supabase ready"
              break
            fi
            echo "Waiting for Supabase... ($i/30)"
            sleep 2
          done
          npx supabase db reset
      - run: npm run lint
      - run: npm run build
      - run: npm test

  e2e-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: npx supabase start
      - name: Export Supabase env
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "ENABLE_TEST_AUTH=true"
          } >> "$GITHUB_ENV"
      - name: Reset local database
        run: |
          # Wait for Supabase to be ready
          for i in {1..30}; do
            if npx supabase status > /dev/null 2>&1; then
              echo "Supabase ready"
              break
            fi
            echo "Waiting for Supabase... ($i/30)"
            sleep 2
          done
          npx supabase db reset
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke

  e2e-full:
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: npx supabase start
      - name: Export Supabase env
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "ENABLE_TEST_AUTH=true"
          } >> "$GITHUB_ENV"
      - name: Reset local database
        run: |
          # Wait for Supabase to be ready
          for i in {1..30}; do
            if npx supabase status > /dev/null 2>&1; then
              echo "Supabase ready"
              break
            fi
            echo "Waiting for Supabase... ($i/30)"
            sleep 2
          done
          npx supabase db reset
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
